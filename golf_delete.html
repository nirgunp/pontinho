      --muted: #555;
      --accent: #1b6b3a;

    }
    * { box-sizing: border-box; }

      margin: 0;

      color: var(--ink);

      margin: 0 auto;

      font-size: 1.75rem;
      margin: 0 0 1.25rem;
      letter-spacing: 0.02em;

      word-break: break-all;

</head>
<body>
  <main>
    <h1>Delete your Golf account</h1>
    <p>
      To delete your Golf account, send an email to
